services:
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: vcmi-portal
    ports:
      - "8000:8000"
    volumes:
      - saves-data:/saves
    environment:
      - SAVES_DIR=/saves
    restart: unless-stopped
    networks:
      - vcmi-longplay

  host:
    build:
      context: ..
      dockerfile: longplay/host/Dockerfile
    container_name: vcmi-host
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - host-data:/home/abc/.local/share/vcmi
    depends_on:
      - portal
    restart: unless-stopped
    networks:
      - vcmi-longplay
    environment:
      - SELKIES_FRAMERATE=24
      - SELKIES_H264_CRF=30-50
      - SELKIES_JPEG_QUALITY=40
      - SELKIES_MANUAL_WIDTH=1280
      - SELKIES_MANUAL_HEIGHT=720

volumes:
  saves-data:
  host-data:

networks:
  vcmi-longplay:
    driver: bridge