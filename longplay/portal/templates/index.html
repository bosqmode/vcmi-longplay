<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCMI Longplay</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#111827', 800: '#1f2937', 700: '#374151', 600: '#4b5563' },
                        accent: { red: '#dc2626', blue: '#1e40af', green: '#22c55e', yellow: '#eab308' }
                    }
                }
            }
        }
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        /* Fade transition */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body class="bg-gray-900">
<div id="app" class="h-full w-full">

    <!-- View A: Login -->
    <div v-if="currentView === 'login'" class="flex items-center justify-center h-full">
        <div class="bg-gray-800 rounded-xl shadow-2xl p-8 w-80 border border-gray-700">
            <h2 class="text-white text-xl font-bold text-center mb-2">VCMI Longplay</h2>
            <input v-model="username" placeholder="Username"
                class="w-full px-4 py-2.5 bg-gray-900 border border-gray-600 rounded-lg text-white placeholder-gray-400 outline-none focus:border-accent-blue mb-3 text-sm"
                @keyup.enter="focusPassword" />
            <input ref="passwordInput" v-model="password" type="password" placeholder="Password"
                class="w-full px-4 py-2.5 bg-gray-900 border border-gray-600 rounded-lg text-white placeholder-gray-400 outline-none focus:border-accent-blue mb-3 text-sm"
                @keyup.enter="login" />
            <button @click="login" :disabled="loggingIn"
                class="w-full py-2.5 bg-blue-900 hover:bg-blue-800 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-lg font-semibold text-sm transition-colors">
                <span v-if="loggingIn">Logging in...</span>
                <span v-else>Login</span>
            </button>
            <p v-if="errorMsg" class="text-red-400 text-center text-sm mt-3">{{ errorMsg }}</p>
        </div>
    </div>

    <!-- View B: Status -->
    <div v-if="currentView === 'status'" class="h-full flex flex-col">
        <div class="h-9 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-5">
            <div class="flex items-center gap-2">
                <span class="text-gray-300 text-sm">{{ gameStateText }}</span>
                <span v-if="isAdmin" class="text-accent-yellow text-xs font-bold bg-yellow-900/30 px-1.5 py-0.5 rounded">ADMIN</span>
            </div>
            <button v-if="!desktopActivated && canActivateDesktop" @click="activateDesktop"
                class="py-1.5 px-4 bg-accent-red hover:bg-red-700 text-white rounded-lg text-xs font-semibold transition-colors">
                Activate Remote Desktop
            </button>
            <button v-if="!desktopActivated && !canActivateDesktop" disabled
                class="py-1.5 px-4 bg-gray-600 text-gray-400 rounded-lg text-xs font-semibold cursor-not-allowed">
                {{ activateButtonDisabledText }}
            </button>
        </div>
    </div>

    <!-- View C: Desktop -->
    <div v-if="currentView === 'desktop'" class="h-full flex flex-col">
        <div class="h-9 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-5">
            <div class="flex items-center gap-2">
                <span class="text-green-400 text-sm">{{ desktopStatusText }}</span>
                <span v-if="isAdmin" class="text-accent-yellow text-xs font-bold bg-yellow-900/30 px-1.5 py-0.5 rounded">ADMIN</span>
            </div>
            <button @click="exitDesktop"
                class="py-1.5 px-4 bg-gray-600 hover:bg-gray-700 text-white rounded-lg text-xs font-semibold transition-colors">
                Exit Desktop
            </button>
        </div>
        <iframe :src="desktopUrl" id="desktop-frame" class="flex-1 w-full border-0"></iframe>
    </div>

</div>

<script>
const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

createApp({
    setup() {
        // View state: 'login' | 'status' | 'desktop'
        const currentView = ref('login');
        const username = ref('');
        const password = ref('');
        const token = ref(null);
        const playerName = ref(null);
        const isAdmin = ref(false);
        const gameState = ref({ player: null, day: 0, playerColor: null });
        const errorMsg = ref('');
        const loggingIn = ref(false);
        const desktopActivated = ref(false);
        const pollTimer = ref(null);

        // Computed
        const canActivateDesktop = computed(() => {
            if (isAdmin.value) return true;
            return gameState.value.player === playerName.value;
        });

        const activateButtonDisabledText = computed(() => {
            if (!gameState.value.player) return 'Waiting for game...';
            return `Wait: ${gameState.value.player}`;
        });

        const gameStateText = computed(() => {
            if (isAdmin.value) return `Logged in as ${playerName.value}. Ready.`;
            if (!gameState.value.player) return 'Connected. Waiting for game state...';
            if (canActivateDesktop.value) return `It's your turn! Click to activate.`;
            return `Waiting for your turn... Current: ${gameState.value.player}`;
        });

        const desktopStatusText = computed(() => {
            if (!gameState.value.player) return 'Remote desktop active';
            if (canActivateDesktop.value) return `Your turn - desktop connected`;
            return 'Turn ended';
        });

        // Use 'lp-token' query param for desktop access (our API authentication), no token forwarded to webtop
        const desktopUrl = computed(() => {
            return token.value ? `/desktop/?lp-token=${token.value}` : '';
        });

        // Methods
        async function login() {
            const u = username.value.trim();
            const p = password.value;
            if (!u || !p) { errorMsg.value = 'Please enter both username and password'; return; }
            loggingIn.value = true;
            errorMsg.value = '';

            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    errorMsg.value = err.detail || 'Login failed';
                    loggingIn.value = false;
                    return;
                }

                const data = await resp.json();
                token.value = data.token;
                playerName.value = data.username;
                isAdmin.value = data.isAdmin || false;
                // Set 'lp-token' cookie for API endpoints (/gamestate, etc.) to avoid conflicts with webtop's own token system
                document.cookie = `lp-token=${token.value}; path=/`;

                // Fetch initial game state
                await fetchGameState();
                currentView.value = 'status';

                // Start polling for game state changes
                startPolling();

            } catch (err) {
                errorMsg.value = 'Failed to login: ' + err.message;
            }
            loggingIn.value = false;
        }

        function focusPassword() {
            // Vue ref will be available on next tick
            setTimeout(() => {
                if (passwordInput.value) passwordInput.value.focus();
            }, 50);
        }

        async function fetchGameState() {
            try {
                const resp = await fetch('/gamestate', {
                    headers: { 'Authorization': `Bearer ${token.value}` }
                });
                if (resp.ok) {
                    gameState.value = await resp.json();
                }
            } catch (e) {
                console.error('Failed to fetch game state:', e);
            }
        }

        function startPolling() {
            const poll = async () => {
                await fetchGameState();
                // Check if we should transition to desktop view automatically for admins
                if (isAdmin.value && !desktopActivated.value) {
                    // Admin can activate but don't auto-activate, let them click
                }
            };
            poll(); // initial fetch
            pollTimer.value = setInterval(poll, 3000);
        }

        async function activateDesktop() {
            if (!canActivateDesktop.value || desktopActivated.value) return;

            desktopActivated.value = true;
            currentView.value = 'desktop';

            if (isAdmin.value) {
                // No additional check needed for admin
            } else {
                // Re-verify it's still their turn
                await fetchGameState();
                if (gameState.value.player !== playerName.value) {
                    errorMsg.value = 'Not your turn!';
                    return;
                }
            }

            // Start monitoring for turn end while in desktop
            startDesktopTurnMonitoring();
        }

        function startDesktopTurnMonitoring() {
            const checkTurn = async () => {
                await fetchGameState();
                if (!isAdmin.value && gameState.value.player !== playerName.value) {
                    // Turn ended - go back to status view
                    currentView.value = 'status';
                    desktopActivated.value = false;
                    if (pollTimer.value) clearInterval(pollTimer.value);
                    startPolling(); // resume status polling
                } else if (gameState.value.player === playerName.value) {
                    // Still your turn
                }
            };
            pollTimer.value = setInterval(checkTurn, 3000);
        }

        function exitDesktop() {
            currentView.value = 'status';
            desktopActivated.value = false;
            if (pollTimer.value) clearInterval(pollTimer.value);
            startPolling();
        }

        return {
            currentView, username, password, token, playerName, isAdmin,
            gameState, errorMsg, loggingIn, desktopActivated,
            canActivateDesktop, activateButtonDisabledText,
            gameStateText, desktopStatusText, desktopUrl,
            login, focusPassword, activateDesktop, exitDesktop
        };
    }
}).mount('#app');
</script>
</body>
</html>
