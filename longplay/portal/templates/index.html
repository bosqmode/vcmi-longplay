<!DOCTYPE html>
<html>
<head>
    <title>VCMI Longplay</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { border: none; width: 90%; height: 90%; }
    </style>
</head>
<body>
    <h1>Longplay portal</h1>
    <input type="text" id="playername" placeholder="Enter player name"/>
    <button id="login-btn">login</button>
    <div id="gamestate"></div>
    <iframe id="desktop-frame"></iframe>

    <script>
        let currentPlayerId = null;
        let turnCheckInterval = null;

        async function handleLogin() {
            const playername = document.getElementById('playername').value.trim();
            if (!playername) {
                alert('Please enter a player ID');
                return;
            }

            currentPlayerId = playername;
            document.cookie = "desktop_token=" + currentPlayerId + "; path=/desktop/";

            // Check if it's this player's turn
            const response = await fetch('/gamestate');
            const status = await response.json();

            if ((!status || status.player == undefined) || currentPlayerId === status.player) {
                // It's your turn - show desktop
                document.getElementById('desktop-frame').src = '/desktop/?token=' + currentPlayerId;
                document.getElementById('desktop-frame').style.display = 'block';
                document.getElementById('gamestate').textContent = 'It is your turn!';

                turnCheckInterval = setInterval(async () => {
                    const response = await fetch('/gamestate');
                    const status = await response.json();
                    console.log(currentPlayerId + " : " + status);
                    if (status && status.player != undefined && currentPlayerId !== status.player) {
                        document.getElementById('desktop-frame').style.display = 'none';
                        document.getElementById('gamestate').textContent = 
                            `Your turn has ended! Current player: ${status.player}`;
                        document.getElementById('gamestate').style.color = 'red';
                        clearInterval(turnCheckInterval);
                    } else {
                        document.getElementById('gamestate').style.color = 'green';
                        document.getElementById('gamestate').textContent = 
                            `It is your turn! Welcome, ${currentPlayerId}.`;
                    }
                }, 3000);
            } else {
                // Not your turn - show waiting message
                document.getElementById('gamestate').textContent = `Current player: ${status.player}`;
            }
        }

        // Bind login button to handler
        document.getElementById('login-btn').addEventListener('click', handleLogin);
    </script>
</body>
</html>
