<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCMI Longplay</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#111827', 800: '#1f2937', 700: '#374151', 600: '#4b5563' },
                        accent: { red: '#dc2626', blue: '#1e40af', green: '#22c55e', yellow: '#eab308' }
                    }
                }
            }
        }
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        /* Fade transition */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body class="bg-gray-900">
<div id="app" class="h-full w-full flex flex-col">
    <!-- HEADER -->
    <div v-if="currentView !== 'login'" class="h-12 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-5">
        <div class="flex items-center gap-2">
            <span class="text-accent-yellow text-md font-bold bg-yellow-900/30 px-1.5 py-0.5 rounded">{{ username }}</span>
        </div>
        <div class="flex items-center gap-3">
            <button @click="toggleDesktop" :disabled="!canActivateDesktop"
                class="py-1.5 px-4 bg-accent-red hover:bg-red-700 text-white rounded-lg text-md font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                {{ activateDesktopButtonText }}
            </button>
            <button @click="logout"
                class="py-1.5 px-4 bg-accent-gray hover:bg-gray-700 text-white rounded-lg text-md font-semibold transition-colors">
                Logout
            </button>
        </div>
    </div>

    <!-- View A: Login -->
    <div v-if="currentView === 'login'" class="flex items-center justify-center h-full">
        <div class="bg-gray-800 rounded-xl shadow-2xl p-8 w-80 border border-gray-700">
            <h2 class="text-white text-xl font-bold text-center mb-2">VCMI Longplay</h2>
            <input v-model="username" placeholder="Username"
                class="w-full px-4 py-2.5 bg-gray-900 border border-gray-600 rounded-lg text-white placeholder-gray-400 outline-none focus:border-accent-blue mb-3 text-sm"
                @keyup.enter="focusPassword" />
            <input ref="passwordInput" v-model="password" type="password" placeholder="Password"
                class="w-full px-4 py-2.5 bg-gray-900 border border-gray-600 rounded-lg text-white placeholder-gray-400 outline-none focus:border-accent-blue mb-3 text-sm"
                @keyup.enter="login" />
            <button @click="login" :disabled="loggingIn"
                class="w-full py-2.5 bg-blue-900 hover:bg-blue-800 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-lg font-semibold text-sm transition-colors">
                <span v-if="loggingIn">Logging in...</span>
                <span v-else>Login</span>
            </button>
            <p v-if="errorMsg" class="text-red-400 text-center text-sm mt-3">{{ errorMsg }}</p>
        </div>
    </div>

    <!-- View B: Status -->
    <div v-if="currentView === 'status'" class="h-full flex flex-col">
        <!-- Centered status card -->
        <div class="flex-1 flex items-center justify-center px-4 py-8">
            <div v-if="gameState.player" class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl p-8 w-full max-w-lg text-center">
                <!-- Player name -->
                <div class="mb-6">
                    <p class="text-gray-400 text-sm font-medium uppercase tracking-wider mb-1">Current Player</p>
                    <p class="text-white text-3xl font-bold">{{ gameState.player }}</p>
                </div>

                <!-- Divider -->
                <div class="border-t border-gray-700 my-4"></div>

                <!-- Day and Color row -->
                <div class="flex items-center justify-center gap-8 mb-6">
                    <!-- Day -->
                    <div class="text-center">
                        <p class="text-gray-400 text-sm font-medium uppercase tracking-wider mb-1">Day</p>
                        <p class="text-white text-4xl font-bold">{{ gameState.day || 0 }}</p>
                    </div>

                    <!-- Player Color -->
                    <div class="text-center">
                        <p class="text-gray-400 text-sm font-medium uppercase tracking-wider mb-1">Color</p>
                        <div class="flex items-center justify-center gap-2 mt-1">
                            <div v-if="gameState.playerColor"
                                :class="'w-8 h-8 rounded-lg shadow-sm ' + playerColorClass(gameState.playerColor)"
                                class="border border-gray-600"></div>
                            <span v-else class="text-gray-500 text-lg">—</span>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="border-t border-gray-700 my-4"></div>

                <div class="mb-6">
                    <button @click="toggleDesktop" :disabled="!canActivateDesktop"
                        class="py-1.5 px-4 bg-accent-red hover:bg-red-700 text-white rounded-lg text-md font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        {{ activateDesktopButtonText }}
                    </button>
                </div>

                <div class="border-t border-gray-700 my-4"></div>

                <!-- Last updated -->
                <p class="text-gray-500 text-xs">Last updated: {{ lastUpdatedText }}</p>
            </div>

            <!-- Empty state: waiting for game -->
            <div v-else class="text-center">
                <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl p-8 w-full max-w-lg">
                    <p class="text-gray-300 text-xl font-semibold mb-2">Waiting for Game</p>
                    <p class="text-gray-500 text-sm">{{ gameStateText }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- View C: Desktop -->
    <div v-if="currentView === 'desktop'" class="flex-1 flex flex-col min-h-0">
        <iframe :src="desktopUrl" id="desktop-frame" class="flex-1 w-full border-0"></iframe>
    </div>

</div>

<script>
const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

createApp({
    setup() {
        // View state: 'login' | 'status' | 'desktop'
        const currentView = ref('login');
        const username = ref('');
        const password = ref('');
        const token = ref(null);
        const playerName = ref(null);
        const isAdmin = ref(false);
        const gameState = ref({ player: null, day: 0, playerColor: null });
        const lastUpdatedTimestamp = ref(null);
        const errorMsg = ref('');
        const loggingIn = ref(false);
        const desktopActivated = ref(false);
        const gamestateInterval = ref(null);
        const turnInterval = ref(null);

        // Computed
        const canActivateDesktop = computed(() => {
            if(gameState.value.player === playerName.value || isAdmin.value){
                return true;
            }
            return false;
        });

        const activateDesktopButtonText = computed(() => {
            if (canActivateDesktop.value && !desktopActivated.value) 
                return 'Play your turn!';
            else if(desktopActivated.value)
                return 'Close desktop';
            return `Not your turn`;
        });

        const gameStateText = computed(() => {
            if (isAdmin.value) return `Logged in as ${playerName.value}. Ready.`;
            if (!gameState.value.player) return 'Connected. Waiting for game state...';
            if (canActivateDesktop.value) return `It's your turn! Click to activate.`;
            return `Waiting for your turn... Current: ${gameState.value.player}`;
        });

        const desktopStatusText = computed(() => {
            if (!gameState.value.player) return 'Remote desktop active';
            if (canActivateDesktop.value) return `Your turn - desktop connected`;
            return 'Turn ended';
        });

        const lastUpdatedText = computed(() => {
            if (!lastUpdatedTimestamp.value) return 'Never';
            // Handle both ISO string (new format) and numeric timestamp (old format)
            let date;
            if (typeof lastUpdatedTimestamp.value === 'string') {
                date = new Date(lastUpdatedTimestamp.value);
            } else {
                date = new Date(lastUpdatedTimestamp.value * 1000);
            }
            return date.toLocaleString();
        });

        const playerColorMap = {
            blue: 'bg-blue-600',
            red: 'bg-red-600',
            green: 'bg-green-600',
            yellow: 'bg-yellow-500',
            orange: 'bg-orange-500',
            purple: 'bg-purple-600',
            cyan: 'bg-cyan-500',
            darkblue: 'bg-indigo-700',
        };

        function playerColorClass(color) {
            if (!color) return 'bg-gray-600';
            const key = color.toLowerCase().replace(/\s+/g, '');
            return playerColorMap[key] || 'bg-gray-600';
        }

        // Use 'lp-token' query param for desktop access (our API authentication), no token forwarded to webtop
        const desktopUrl = computed(() => {
            return token.value ? `/desktop/?lp-token=${token.value}` : '';
        });

        // Methods
        async function login() {
            const u = username.value.trim();
            const p = password.value;
            if (!u || !p) { errorMsg.value = 'Please enter both username and password'; return; }
            loggingIn.value = true;
            errorMsg.value = '';

            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    errorMsg.value = err.detail || 'Login failed';
                    loggingIn.value = false;
                    return;
                }

                const data = await resp.json();
                token.value = data.token;
                playerName.value = data.username;
                isAdmin.value = data.isAdmin || false;
                // Set 'lp-token' cookie for API endpoints (/gamestate, etc.) to avoid conflicts with webtop's own token system
                document.cookie = `lp-token=${token.value}; path=/`;

                // Fetch initial game state
                await fetchGameState();
                currentView.value = 'status';

                // Start polling for game state changes
                startGamestatePolling();

            } catch (err) {
                errorMsg.value = 'Failed to login: ' + err.message;
            }
            loggingIn.value = false;
        }

        function focusPassword() {
            // Vue ref will be available on next tick
            setTimeout(() => {
                if (passwordInput.value) passwordInput.value.focus();
            }, 50);
        }

        async function fetchGameState() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const resp = await fetch('/gamestate', {
                    signal: controller.signal,
                    headers: { 'Authorization': `Bearer ${token.value}` }
                });
                if (resp.ok) {
                    const data = await resp.json();
                    gameState.value = { player: data.player, day: data.day, playerColor: data.playerColor };
                    // Store timestamp as-is; server now sends ISO format strings
                    lastUpdatedTimestamp.value = data.timestamp || null;
                }
            } catch (e) {
                if(e.name === 'AbortError'){
                    console.error('Fetching gamestate failed due to timeout');
                }
                else{
                    console.error('Failed to fetch game state:', e);
                }
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function startGamestatePolling() {
            if(gamestateInterval.value)
                return;

            const poll = async () => {
                await fetchGameState();
                // Check if we should transition to desktop view automatically for admins
                if (isAdmin.value && !desktopActivated.value) {
                    // Admin can activate but don't auto-activate, let them click
                }
            };
            poll(); // initial fetch
            gamestateInterval.value = setInterval(poll, 3000);
        }

        function stopGamestatePolling(){
            if(!gamestateInterval.value)
                return;

            clearInterval(gamestateInterval.value);
            gamestateInterval.value = null;
        }

        async function logout(){
            exitDesktop();
            currentView.value = 'login';
            username.value = '';
            password.value = '';
            token.value = '';
            document.cookie = "lp-token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT;";
            stopGamestatePolling();
            stopDesktopTurnMonitoring();
        }

        async function toggleDesktop() {
            if(desktopActivated.value)
            {
                exitDesktop();
                return;   
            }

            if (!canActivateDesktop.value) 
                return;

            desktopActivated.value = true;
            currentView.value = 'desktop';

            if (isAdmin.value) {
                // No additional check needed for admin
            } else {
                // Re-verify it's still their turn
                await fetchGameState();
                if (gameState.value.player !== playerName.value) {
                    errorMsg.value = 'Not your turn!';
                    return;
                }
            }

            // Start monitoring for turn end while in desktop
            startDesktopTurnMonitoring();
        }

        function startDesktopTurnMonitoring() {
            if(turnInterval.value)
                return;

            const checkTurn = async () => {
                await fetchGameState();
                if (!isAdmin.value && gameState.value.player !== playerName.value) {
                    // Turn ended - go back to status view
                    currentView.value = 'status';
                    desktopActivated.value = false;
                    stopDesktopTurnMonitoring();
                    startGamestatePolling(); // resume status polling
                } else if (gameState.value.player === playerName.value) {
                    // Still your turn
                }
            };
            turnInterval.value = setInterval(checkTurn, 3000);
        }

        function stopDesktopTurnMonitoring(){
            if(!turnInterval.value)
                return;

            clearInterval(turnInterval.value);
            turnInterval.value = null;
        }

        function exitDesktop() {
            currentView.value = 'status';
            desktopActivated.value = false;
            startGamestatePolling();
            stopDesktopTurnMonitoring();
        }

        return {
            currentView, username, password, token, playerName, isAdmin,
            gameState, errorMsg, loggingIn, desktopActivated, lastUpdatedTimestamp,
            canActivateDesktop, activateDesktopButtonText,
            gameStateText, desktopStatusText, lastUpdatedText, desktopUrl,
            playerColorClass,
            login, focusPassword, toggleDesktop, exitDesktop, logout
        };
    }
}).mount('#app');
</script>
</body>
</html>
